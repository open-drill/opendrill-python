# Publishes to PyPI when a GitHub Release is published for a tag such as v0.1.0. Uses PyPI Trusted Publishing:
# on pypi.org, the opendrill project has this repository, this workflow and the "pypi" environment
# as a trusted publisher, so no API token is stored anywhere.
name: publish

on:
  release:
    types: [published]

# Every job gets read-only repository access unless it asks for more.
# Only the publish job adds id-token: write, for PyPI Trusted Publishing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --python 3.12 --extra dev pytest -q
      - run: uv build
      - name: The tag matches the package version
        run: |
          version=$(uv run --python 3.12 python -c "import opendrill; print(opendrill.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
